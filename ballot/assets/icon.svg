<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The application's face in a taskbar and on a desktop: a ballot
       going into a box, in the association's navy and gold. Nothing
       smaller than a few pixels wide, so it still reads at 16px. -->
  <rect width="256" height="256" rx="48" fill="#0B1B3A" />

  <!-- The paper, going in -->
  <g transform="rotate(-8 128 96)">
    <rect x="80" y="40" width="96" height="76" rx="6" fill="#FFFFFF" />
    <rect x="94" y="58" width="68" height="9" rx="4.5" fill="#0B1B3A" opacity="0.28" />
    <path d="M97 88l12 12 26-26" fill="none" stroke="#F2B134" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- The box -->
  <path d="M44 126h168a10 10 0 0 1 10 10v62a14 14 0 0 1-14 14H48a14 14 0 0 1-14-14v-62a10 10 0 0 1 10-10z" fill="#F2B134" />
  <rect x="86" y="140" width="84" height="14" rx="7" fill="#0B1B3A" />
</svg>
